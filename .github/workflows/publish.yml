# Publishes the site to GitHub Pages: on every push, and twice a day so the music section shows the
# newest mix from the Disco Disko Lo-Fi channel without anyone editing anything (scripts/latest-mix.js
# rewrites index.html in the checkout before it is uploaded; nothing is committed back).
# GitHub Pages is set to build from this workflow ("GitHub Actions" as the source), not from the branch.
name: Publish the site

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'    # 05:00 UTC, every day
    - cron: '0 19 * * *'   # 19:00 UTC, two hours after a 18:00 CET premiere
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Newest mix from the Lo-Fi channel into index.html
        run: node .github/scripts/latest-mix.js
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # optional: a YouTube Data API key, for the video's length
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
